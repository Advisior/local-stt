name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the app to"
        required: true

permissions:
  contents: write

env:
  # Never interpolate the input directly into a run block: it would be a shell
  # injection point. Bind it once here and quote it everywhere below.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-app:
    # Apple Silicon runner: the app is arm64 only and needs the Swift toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check version consistency
        run: bash scripts/check-versions.sh

      - name: Verify tag matches project version
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' pyproject.toml | head -1)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build app bundle
        run: bash scripts/build-app.sh

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/Local-STT-*.zip --clobber
