name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the app to"
        required: true

permissions:
  contents: write

env:
  # Never interpolate the input directly into a run block: it would be a shell
  # injection point. Bind it once here and quote it everywhere below.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-app:
    # Apple Silicon runner: the app is arm64 only and needs the Swift toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check version consistency
        run: bash scripts/check-versions.sh

      - name: Verify tag matches project version
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' pyproject.toml | head -1)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build app bundle
        run: bash scripts/build-app.sh

      # install.sh refuses the prebuilt app when the zip does not match this.
      - name: Write SHA-256 of the zip
        working-directory: dist
        run: |
          for zip in Local-STT-*.zip; do
            shasum -a 256 "$zip" > "$zip.sha256"
          done

      - name: Attach zip and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/Local-STT-*.zip dist/Local-STT-*.zip.sha256 --clobber

  build-runtime:
    # Standalone Python runtime for install.sh (#63). A separate job: when it
    # fails, the app zip still ships and install.sh falls back to uv/python3.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check version consistency
        run: bash scripts/check-versions.sh

      - name: Verify tag matches project version
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' pyproject.toml | head -1)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match pyproject version $version" >&2
            exit 1
          fi

      # Downloads the pinned CPython and refuses it unless its SHA-256 matches
      # scripts/runtime/python-build-standalone.env; dependencies are
      # installed from hash-locked requirements only. Writes the .sha256 that
      # install.sh checks.
      - name: Build standalone runtime
        run: bash scripts/build-runtime.sh

      - name: Attach runtime and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/Local-STT-runtime-*.tar.gz dist/Local-STT-runtime-*.tar.gz.sha256 --clobber
